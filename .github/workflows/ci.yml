name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # Same images as infra/docker-compose.yml.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      neo4j:
        image: neo4j:2026.10.2-community
        env:
          NEO4J_AUTH: neo4j/orbit-dev-password
          NEO4J_PLUGINS: '["graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: gds.*
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p orbit-dev-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20 --health-start-period 30s
    env:
      DATABASE_URL: postgresql+asyncpg://orbit:orbit@localhost:5432/orbit
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: orbit-dev-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Test (includes architecture rules)
        run: uv run pytest

  api-image:
    # The production image from api/Dockerfile builds (task 10.5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t orbit-api:ci api
      - run: docker run --rm orbit-api:ci python -c "import orbit.main, orbit.worker"

  api-types:
    # Fails if web/src/lib/api is stale: run ./scripts/gen-api-types.sh and commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd api && uv sync --locked
      - run: cd web && npm ci
      - run: ./scripts/gen-api-types.sh
      - name: Generated API types are committed and current
        run: git diff --exit-code -- web/src/lib/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Build-time only; Better Auth refuses its default secret. Not used to sign anything.
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
