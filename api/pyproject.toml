[project]
name = "orbit-api"
version = "0.1.0"
description = "Orbit API and worker (modular monolith)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "certifi>=2026.10.23",
    "fastapi>=0.162.5",
    "httpx2>=2.16.0",
    "neo4j>=6.4.1",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=5.3",
    "sentry-sdk[fastapi]>=2.75.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[dependency-groups]
dev = [
    "grimp>=3.19",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"] # assert is how pytest works; tests use seeded random
"migrations/versions/**" = ["E501"]
"loadtest/**" = ["S101", "S311", "S603", "E501"] # a dev script that drives the stack # generated SQL strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# One event loop for the whole run, so session-scoped DB/Redis fixtures can be shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
