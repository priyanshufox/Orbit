[project]
name = "orbit-api"
version = "0.1.0"
description = "Orbit API and worker (modular monolith)"
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies (FastAPI, SQLAlchemy, arq, ...) are added in tasks 1.1–1.2.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[dependency-groups]
dev = [
    "grimp>=3.19",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
