[project]
name = "orbit-api"
version = "0.1.0"
description = "Orbit API and worker (modular monolith)"
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies (FastAPI, SQLAlchemy, arq, ...) are added in tasks 1.1–1.2.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]
